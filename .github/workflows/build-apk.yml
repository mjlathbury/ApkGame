name: Build offline Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download project source
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/mjlathbury/ApkGame/releases/download/v1.0.0/HouseRules_Android_Offline_Project_v1.0.2.zip \
            --output HouseRules_Android_Offline_Project.zip
          echo "2d300f11f4fc96c52e1af6ef291790cdb8b417dcfd5c501b770a8d2eb8609700  HouseRules_Android_Offline_Project.zip" | sha256sum --check
          mkdir project
          unzip -q HouseRules_Android_Offline_Project.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: house-rules-offline-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
